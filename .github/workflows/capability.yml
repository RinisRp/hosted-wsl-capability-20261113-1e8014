{
  "name": "Owned Windows transport qualification",
  "run-name": "Owned Windows transport qualification ${{ inputs.nonce }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "nonce": {
          "type": "string",
          "required": true
        },
        "private_host": {
          "required": false,
          "type": "boolean",
          "description": "One opaque owned integration after source qualification",
          "default": false
        },
        "ack_public_key": {
          "required": false,
          "type": "string",
          "description": "Public RSA3072 verification key; never a private key",
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualification": {
      "if": "${{ github.actor == 'RinisRp' && github.repository == 'RinisRp/hosted-wsl-capability-20261113-1e8014' && github.ref == 'refs/heads/codex/issue-447-private-canonical-host' }}",
      "runs-on": "windows-2025-vs2026",
      "timeout-minutes": 210,
      "env": {
        "PROBE_NONCE": "${{ inputs.nonce }}"
      },
      "steps": [
        {
          "name": "Checkout exact generic source",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "timeout-minutes": 10,
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Qualify frozen generic source and controls",
          "id": "source",
          "timeout-minutes": 35,
          "shell": "powershell",
          "run": "$ErrorActionPreference='Stop'\n& .\\scripts\\qualify-bridge-source.ps1\n"
        },
        {
          "name": "Preserve bounded generic source evidence",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "timeout-minutes": 5,
          "with": {
            "name": "owned-source-qualification",
            "path": "${{ steps.source.outputs.out_path }}",
            "retention-days": 14,
            "if-no-files-found": "error"
          },
          "if": "${{ always() && steps.source.outputs.out_path != '' }}"
        },
        {
          "id": "generic",
          "name": "Probe generic Windows pipe and Linux engine",
          "run": "$ErrorActionPreference='Stop'\n& .\\scripts\\probe-wsl.ps1\n",
          "timeout-minutes": 30,
          "if": "${{ success() && !inputs.private_host }}",
          "shell": "powershell"
        },
        {
          "id": "opaque",
          "name": "Exercise one opaque owned integration",
          "run": "$ErrorActionPreference='Stop'\n& .\\scripts\\probe-wsl.ps1 -OpaquePrivateHost\n",
          "timeout-minutes": 145,
          "if": "${{ success() && inputs.private_host }}",
          "shell": "powershell",
          "env": {
            "OWNED_ACK_PUBLIC_KEY": "${{ inputs.ack_public_key }}",
            "OWNED_RUNNER_PACKET": "${{ secrets.OWNED_RUNNER_PACKET }}"
          }
        },
        {
          "name": "Preserve bounded generic capability evidence",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "timeout-minutes": 5,
          "with": {
            "name": "owned-generic-capability",
            "path": "${{ steps.generic.outputs.out_path }}",
            "retention-days": 14,
            "if-no-files-found": "error"
          },
          "if": "${{ always() && !inputs.private_host && steps.generic.outputs.out_path != '' }}"
        },
        {
          "name": "Preserve only reconstructed generic disposition",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "timeout-minutes": 5,
          "with": {
            "name": "owned-generic-disposition",
            "path": "${{ steps.opaque.outputs.generic_disposition_file }}",
            "retention-days": 14,
            "if-no-files-found": "error"
          },
          "if": "${{ always() && inputs.private_host && steps.opaque.outputs.generic_disposition_file != '' }}"
        }
      ]
    }
  }
}